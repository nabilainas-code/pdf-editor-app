name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer la structure Android standard
        run: |
          flutter create --platforms=android --org com.nabilainas.pdfeditor temp_app
          cp -r lib/. temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Forcer le SDK Android pour tous les modules
        run: |
          echo 'subprojects {' >> temp_app/android/build.gradle.kts
          echo '    afterEvaluate {' >> temp_app/android/build.gradle.kts
          echo '        extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {' >> temp_app/android/build.gradle.kts
          echo '            it.compileSdkVersion(36)' >> temp_app/android/build.gradle.kts
          echo '        }' >> temp_app/android/build.gradle.kts
          echo '    }' >> temp_app/android/build.gradle.kts
          echo '}' >> temp_app/android/build.gradle.kts

      - name: Installer les dépendances
        working-directory: temp_app
        run: flutter pub get

      - name: Compiler l'APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: application-pdf-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
