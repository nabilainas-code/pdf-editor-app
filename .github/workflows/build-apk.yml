name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Générer la structure Android standard
        run: |
          flutter create --platforms=android --org com.nabilainas.pdfeditor temp_app
          cp -r lib/. temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Autoriser l'accès à internet et l'ouverture de PDF
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' temp_app/android/app/src/main/AndroidManifest.xml
          cat > /tmp/fix_manifest.py << 'PYEOF'
          path = 'temp_app/android/app/src/main/AndroidManifest.xml'
          content = open(path).read()
          intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:mimeType="application/pdf" />
                  </intent-filter>
          '''
          content = content.replace('</activity>', intent_filter + '        </activity>', 1)
          open(path, 'w').write(content)
          PYEOF
          python3 /tmp/fix_manifest.py

      - name: Écrire le code natif de récupération du PDF
        run: |
          cat > /tmp/write_main_activity.py << 'PYEOF'
          path = 'temp_app/android/app/src/main/kotlin/com/nabilainas/pdfeditor/temp_app/MainActivity.kt'
          content = '''package com.nabilainas.pdfeditor.temp_app

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.nabilainas.pdfeditor/open_pdf"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getInitialPdfPath") {
                          result.success(resolveIncomingPdfPath())
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun resolveIncomingPdfPath(): String? {
                  val uri: Uri? = when (intent?.action) {
                      Intent.ACTION_VIEW -> intent?.data
                      Intent.ACTION_SEND -> {
                          if (Build.VERSION.SDK_INT >= 33) {
                              intent?.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent?.getParcelableExtra(Intent.EXTRA_STREAM)
                          }
                      }
                      else -> null
                  }
                  if (uri == null) return null
                  return try {
                      val inputStream = contentResolver.openInputStream(uri) ?: return null
                      val outFile = File(cacheDir, "shared_input.pdf")
                      FileOutputStream(outFile).use { output ->
                          inputStream.copyTo(output)
                      }
                      outFile.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          '''
          open(path, 'w').write(content)
          PYEOF
          python3 /tmp/write_main_activity.py

      - name: Ignorer les classes ML Kit optionnelles non utilisées (R8)
        run: |
          cat >> temp_app/android/app/proguard-rules.pro << 'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF

      - name: Installer les dépendances
        working-directory: temp_app
        run: flutter pub get

      - name: Compiler l'APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: application-pdf-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
