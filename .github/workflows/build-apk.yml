name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Générer la structure Android standard
        run: |
          flutter create --platforms=android --org com.nabilainas.pdfeditor temp_app
          cp -r lib/. temp_app/lib/
          cp -r assets temp_app/assets
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Autoriser l'accès à internet et l'ouverture de PDF
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' temp_app/android/app/src/main/AndroidManifest.xml
          cat > /tmp/fix_manifest.py << 'PYEOF'
          path = 'temp_app/android/app/src/main/AndroidManifest.xml'
          content = open(path).read()
          # Deux filtres : un avec mimeType seul (couvre les apps qui envoient
          # un content:// sans préciser de schéma dans le filtre), un avec les
          # schémas file/content explicites (couvre les gestionnaires de
          # fichiers plus anciens qui exigent une correspondance de schéma).
          # Sans ce doublon, l'application n'apparaissait pas dans « Ouvrir
          # avec » pour certains gestionnaires de fichiers.
          intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:mimeType="application/pdf" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="file" android:mimeType="application/pdf" />
                      <data android:scheme="content" android:mimeType="application/pdf" />
                  </intent-filter>
          '''
          content = content.replace('</activity>', intent_filter + '        </activity>', 1)
          if 'android:exported="true"' not in content.split('<activity')[1].split('>')[0]:
              content = content.replace('<activity ', '<activity android:exported="true" ', 1)
          open(path, 'w').write(content)
          PYEOF
          python3 /tmp/fix_manifest.py

      - name: Écrire le code natif de récupération du PDF
        run: |
          cat > /tmp/write_main_activity.py << 'PYEOF'
          path = 'temp_app/android/app/src/main/kotlin/com/nabilainas/pdfeditor/temp_app/MainActivity.kt'
          content = '''package com.nabilainas.pdfeditor.temp_app

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.nabilainas.pdfeditor/open_pdf"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getInitialPdfPath") {
                          result.success(resolveIncomingPdfPath())
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun resolveIncomingPdfPath(): String? {
                  val uri: Uri? = when (intent?.action) {
                      Intent.ACTION_VIEW -> intent?.data
                      Intent.ACTION_SEND -> {
                          if (Build.VERSION.SDK_INT >= 33) {
                              intent?.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent?.getParcelableExtra(Intent.EXTRA_STREAM)
                          }
                      }
                      else -> null
                  }
                  if (uri == null) return null
                  return try {
                      val inputStream = contentResolver.openInputStream(uri) ?: return null
                      val outFile = File(cacheDir, "shared_input.pdf")
                      FileOutputStream(outFile).use { output ->
                          inputStream.copyTo(output)
                      }
                      outFile.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          '''
          open(path, 'w').write(content)
          PYEOF
          python3 /tmp/write_main_activity.py

      - name: Protéger les classes ML Kit du minifieur R8
        run: |
          cat >> temp_app/android/app/proguard-rules.pro << 'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_bundled_latin.** { *; }
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF

      # Le numéro de compilation est inscrit dans l'application : sans lui,
      # impossible de savoir depuis le téléphone quelle version est
      # installée, ni si la correction attendue s'y trouve.
      - name: Inscrire le numéro de version dans l'application
        run: |
          sed -i 's/const String versionApp = "dev";/const String versionApp = "${{ github.run_number }}";/' temp_app/lib/main.dart
          grep -n 'const String versionApp' temp_app/lib/main.dart

      # Signer avec une clé fixe, pour installer par-dessus la version
      # précédente au lieu de désinstaller à chaque fois. Sans clé, Android
      # en fabrique une nouvelle à chaque compilation, et refuse alors la
      # mise à jour.
      #
      # La clé n'est pas dans le dépôt — il est public. Elle vit dans les
      # secrets du dépôt, que seul son propriétaire peut y déposer. Tant
      # qu'ils sont absents, la compilation se déroule comme avant : on
      # perd la commodité, jamais la build.
      - name: Préparer la clé de signature
        id: cle
        env:
          CLE_BASE64: ${{ secrets.CLEF_ANDROID_BASE64 }}
          CLE_MDP: ${{ secrets.CLEF_ANDROID_MDP }}
        run: |
          # Un secret se colle à la main, souvent depuis un téléphone : il
          # arrive avec des retours à la ligne et des espaces en trop. Le
          # texte utile ne contient ni l'un ni l'autre, on le nettoie donc
          # avant de s'en servir plutôt que d'échouer dessus.
          CLE_PROPRE=$(printf '%s' "$CLE_BASE64" | tr -d '[:space:]')
          MDP_PROPRE=$(printf '%s' "$CLE_MDP" | tr -d '[:space:]')
          echo "::add-mask::$MDP_PROPRE"

          # Les deux secrets vont ensemble. La clé sans son mot de passe
          # échouerait bien plus loin, dans un message de Gradle que
          # personne ne rattache à ça.
          if [ -n "$CLE_PROPRE" ] && [ -z "$MDP_PROPRE" ]; then
            echo "::error::Le secret CLEF_ANDROID_MDP est absent. La clé est là, son mot de passe non : ajoutez-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CLE_PROPRE" ]; then
            echo "presente=non" >> "$GITHUB_OUTPUT"
            echo "Pas de clé : APK non signé, il faudra désinstaller avant d'installer."
            exit 0
          fi
          if ! printf '%s' "$CLE_PROPRE" | base64 -d > temp_app/android/app/cle.jks; then
            echo "::error::Le secret CLEF_ANDROID_BASE64 n'est pas lisible. Recollez le contenu entier de cle-base64.txt, sans rien ajouter."
            exit 1
          fi
          # Vérifier tout de suite que la clé s'ouvre avec ce mot de passe :
          # sinon l'erreur n'arriverait qu'à la toute fin de la compilation.
          if ! keytool -list -keystore temp_app/android/app/cle.jks -storepass "$MDP_PROPRE" -alias editeur > /dev/null 2>&1; then
            echo "::error::La clé ne s'ouvre pas avec ce mot de passe. Vérifiez le secret CLEF_ANDROID_MDP."
            exit 1
          fi
          echo "CLE_MDP=$MDP_PROPRE" >> "$GITHUB_ENV"
          echo "presente=oui" >> "$GITHUB_OUTPUT"
          echo "Clé lue et vérifiée."
          cat > /tmp/signer.py << 'PYEOF'
          import os, sys
          base = 'temp_app/android/app/'
          chemin = base + 'build.gradle.kts'
          kotlin = os.path.exists(chemin)
          if not kotlin:
              chemin = base + 'build.gradle'
          contenu = open(chemin).read()

          if kotlin:
              bloc = '''    signingConfigs {
                  create("editeur") {
                      storeFile = file("cle.jks")
                      storePassword = System.getenv("CLE_MDP")
                      keyAlias = "editeur"
                      keyPassword = System.getenv("CLE_MDP")
                  }
              }

          '''
              ancien = 'signingConfigs.getByName("debug")'
              nouveau = 'signingConfigs.getByName("editeur")'
          else:
              bloc = '''    signingConfigs {
                  editeur {
                      storeFile file("cle.jks")
                      storePassword System.getenv("CLE_MDP")
                      keyAlias "editeur"
                      keyPassword System.getenv("CLE_MDP")
                  }
              }

          '''
              ancien = 'signingConfigs.debug'
              nouveau = 'signingConfigs.editeur'

          if 'buildTypes {' not in contenu or ancien not in contenu:
              sys.exit('Gabarit Android inattendu : ' + chemin)
          contenu = contenu.replace('buildTypes {', bloc.rstrip() + chr(10) + chr(10) + '    buildTypes {', 1)
          contenu = contenu.replace(ancien, nouveau, 1)
          open(chemin, 'w').write(contenu)
          print('Signature branchée dans ' + chemin)
          PYEOF
          python3 /tmp/signer.py

      - name: Installer les dépendances
        working-directory: temp_app
        run: flutter pub get

      - name: Compiler l'APK
        working-directory: temp_app
        run: flutter build apk --release

      # Toutes les compilations produisaient un « app-release.apk » : dans
      # le dossier Téléchargements du téléphone, impossible de dire lequel
      # était lequel. Chaque APK porte maintenant son numéro de build.
      - name: Nommer l'APK avec le numéro de build
        run: |
          mv temp_app/build/app/outputs/flutter-apk/app-release.apk \
             temp_app/build/app/outputs/flutter-apk/editeur-pdf-${{ github.run_number }}.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: application-pdf-apk-${{ github.run_number }}
          path: temp_app/build/app/outputs/flutter-apk/editeur-pdf-${{ github.run_number }}.apk
