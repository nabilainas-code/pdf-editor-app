name: pdf_editor_app
description: "Visualiseur et éditeur de PDF"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_pdfview: ^1.3.2
  syncfusion_flutter_pdf: ^28.1.38
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: 10.3.10
  printing: ^5.12.0
  google_mlkit_text_recognition: ^0.13.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Polices Liberation (SIL OFL 1.1), embarquées dans le PDF quand une
  # ligne est réécrite : contrairement aux polices standard d'un PDF,
  # elles savent écrire tirets cadratins, puces et apostrophes
  # typographiques, et sont dessinées aux largeurs d'Arial, Times New
  # Roman et Courier New.
  assets:
    - assets/fonts/
